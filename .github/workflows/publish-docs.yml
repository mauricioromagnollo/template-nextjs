# Builds the MkDocs Material site and publishes it to GitHub Pages.
#
# ---------------------------------------------------------------------------
# Setup required after cloning this template
# ---------------------------------------------------------------------------
# Enable Pages once, under "Settings > Pages", and set "Source" to
# "GitHub Actions". No secret or personal access token is needed: the deploy is
# authenticated with the workflow's own OIDC token.
# ---------------------------------------------------------------------------
name: Publish Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# The `pages` group is shared with any other workflow that deploys Pages.
# In-progress deploys are left alone so a half-published site is never served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `git-revision-date` style plugins read the commit history to render
          # "last updated" stamps, which needs more than a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        # `--strict` turns warnings (broken internal links, orphan pages, unknown
        # nav entries) into build failures, so the published site is never
        # quietly degraded.
        run: mkdocs build --strict

      # `--strict` cannot catch this one. When the Markdown toolchain resolves to
      # an incompatible combination, SuperFences registers but never runs: fenced
      # code blocks render as literal paragraphs, and an HTML-looking token
      # inside one swallows the rest of the page. The build still exits 0.
      - name: Verify code blocks rendered
        run: |
          if grep -rlF '<p>```' site --include='*.html'; then
            echo "::error::Fenced code blocks rendered as literal text in the files above."
            echo "::error::The docs toolchain in docs/requirements.txt is resolving to an incompatible set."
            exit 1
          fi
          echo "All fenced code blocks rendered as code."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required to publish the artifact and to mint the OIDC token that
      # `deploy-pages` exchanges for a Pages deployment credential.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
